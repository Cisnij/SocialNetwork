user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # DNS Resolver cho Docker
    resolver 127.0.0.11 ipv6=off valid=30s;

    # -------------------------------------------------
    # Logging
    # -------------------------------------------------

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time';

    log_format ws '$remote_addr [$time_local] '
                  '"$request_method $uri $server_protocol" '
                  '$status rt=$request_time';

    access_log /var/log/nginx/access.log main;

    # -------------------------------------------------
    # Performance
    # -------------------------------------------------

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 65;
    keepalive_requests 1000;

    reset_timedout_connection on;

    client_body_timeout 30;
    send_timeout 30;

    # -------------------------------------------------
    # Buffer
    # -------------------------------------------------

    client_max_body_size 50M;

    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;

    proxy_buffer_size 16k;
    proxy_buffers 4 32k;
    proxy_busy_buffers_size 64k;

    # -------------------------------------------------
    # Gzip
    # -------------------------------------------------

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;

    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # -------------------------------------------------
    # Rate Limit
    # -------------------------------------------------

    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=upload:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=ws_connect:10m rate=30r/m;

    # -------------------------------------------------
    # Connection Limit
    # -------------------------------------------------

    limit_conn_zone $binary_remote_addr zone=http_conn:10m;
    limit_conn_zone $binary_remote_addr zone=ws_conn:10m;

    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # -------------------------------------------------
    # Upstream
    # -------------------------------------------------

    upstream frontend {
        server frontend:8000;
        keepalive 32;
    }

    upstream django {
        server django:8000;
        keepalive 32;
    }

    # =================================================
    # Server 1: Frontend
    # =================================================

    server {
        listen 80;
        server_name socialnetwork.dpdns.org;

        # ---------------- Security ----------------
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        limit_conn http_conn 50;

        # ---------------- Frontend ----------------
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 60;
            proxy_connect_timeout 10;
        }

        # ---------------- Health ----------------
        location = /nginx-health {
            return 200;
        }

        # ---------------- Hidden files ----------------
        location ~ /\. {
            deny all;
            access_log off;
        }

        # ---------------- Error pages ----------------
        error_page 429 /429.html;
        error_page 500 502 503 504 /50x.html;

        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }

    # =================================================
    # Server 2: API & Backend
    # =================================================
    # dù user vào fe hay be thì cloudflare đều trỏ tới localhost:80 và nginx sẽ lấy cái head host so với cái server_name mà load ra cái đó 
    # Nếu user gõ socialnetwork.dpdns.org → request gửi tới localhost:80 với header Host: socialnetwork.dpdns.org
    # Nếu user gõ api.socialnetwork.dpdns.org → request gửi tới localhost:80 với header Host: api.socialnetwork.dpdns.org
    server {
        listen 80;
        server_name api.socialnetwork.dpdns.org;

        # ---------------- Security ----------------
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        limit_conn http_conn 50;

        # ---------------- Admin ----------------
        location /static/ {

            proxy_pass http://django;

            proxy_http_version 1.1;

            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location /supremacy/admin/ {
            proxy_pass http://django;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # ---------------- Auth ----------------
        location ~* ^/api/(auth|login|register|password) {
            limit_req zone=auth burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://django;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # ---------------- Upload ----------------
        location ~* ^/api/.*(upload|avatar|photo|media) {
            limit_req zone=upload burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://django;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 120;
            proxy_connect_timeout 10;
        }

        # ---------------- API ----------------
        location /api/ {
            limit_req zone=api burst=200 nodelay;
            limit_req_status 429;
            proxy_pass http://django;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 60;
            proxy_connect_timeout 10;
        }

        # ---------------- WebSocket ----------------
        location /ws/ {
            limit_req zone=ws_connect burst=20 nodelay;
            limit_req_status 429;
            limit_conn ws_conn 100;
            proxy_pass http://django;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            proxy_connect_timeout 60;
            proxy_buffering off;
            access_log /var/log/nginx/ws.log ws;
        }

        # ---------------- Media ----------------
        location /media/ {
            proxy_pass http://django;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # ---------------- Health ----------------
        location = /nginx-health {
            return 200;
        }

        # ---------------- Hidden files ----------------
        location ~ /\. {
            deny all;
            access_log off;
        }

        # ---------------- Error pages ----------------
        error_page 429 /429.html;
        error_page 500 502 503 504 /50x.html;

        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}