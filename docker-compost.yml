version: '3.8'

services:
  db:
    image: percona/percona-server:8.4
    container_name: percona84
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Chinghi1607
      MYSQL_DATABASE: SocialNetwork
      MYSQL_USER: ChiNghi
      MYSQL_PASSWORD: Chinghi1607
    ports:
      - "3306:3306"
    volumes:
      - percona_data:/var/lib/mysql

  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  redis:
    image: redis:latest
    container_name: my-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  percona_data:
  es_data: