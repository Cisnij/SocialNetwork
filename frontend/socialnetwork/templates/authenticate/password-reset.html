{%load static%}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
          },
          colors: {
            primary: {
              50: '#f5f3ff',
              100: '#ede9fe',
              200: '#ddd6fe',
              300: '#c4b5fd',
              400: '#a78bfa',
              500: '#8b5cf6',
              600: '#7c3aed',
              700: '#6d28d9',
              800: '#5b21b6',
              900: '#4c1d95',
            },
            'oklch': {
              primary: 'oklch(0.65 0.19 250)',
              secondary: 'oklch(0.85 0.05 250)',
              accent: 'oklch(0.7 0.15 320)',
              success: 'oklch(0.7 0.17 142)',
              warning: 'oklch(0.8 0.15 85)',
              error: 'oklch(0.65 0.2 25)',
            }
          },
          animation: {
            'gradient-x': 'gradient-x 15s ease infinite',
            'gradient-y': 'gradient-y 15s ease infinite',
            'gradient-xy': 'gradient-xy 15s ease infinite',
            'float': 'float 6s ease-in-out infinite',
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'bounce-slow': 'bounce 2s infinite',
            'slide-up': 'slideUp 0.5s ease-out',
            'scale-in': 'scaleIn 0.3s ease-out',
            'fade-in': 'fadeIn 0.3s ease-in',
            'shake': 'shake 0.5s ease-in-out',
          },
          keyframes: {
            'gradient-x': {
              '0%, 100%': {
                'background-size': '200% 200%',
                'background-position': 'left center'
              },
              '50%': {
                'background-size': '200% 200%',
                'background-position': 'right center'
              },
            },
            'gradient-y': {
              '0%, 100%': {
                'background-size': '200% 200%',
                'background-position': 'center top'
              },
              '50%': {
                'background-size': '200% 200%',
                'background-position': 'center bottom'
              },
            },
            'gradient-xy': {
              '0%, 100%': {
                'background-size': '400% 400%',
                'background-position': 'left center'
              },
              '50%': {
                'background-size': '400% 400%',
                'background-position': 'right center'
              },
            },
            'float': {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-20px)' },
            },
            'slideUp': {
              '0%': { transform: 'translateY(20px)', opacity: '0' },
              '100%': { transform: 'translateY(0)', opacity: '1' },
            },
            'scaleIn': {
              '0%': { transform: 'scale(0.9)', opacity: '0' },
              '100%': { transform: 'scale(1)', opacity: '1' },
            },
            'fadeIn': {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            'shake': {
              '0%, 100%': { transform: 'translateX(0)' },
              '10%, 30%, 50%, 70%, 90%': { transform: 'translateX(-5px)' },
              '20%, 40%, 60%, 80%': { transform: 'translateX(5px)' },
            },
          },
        }
      }
    }
  </script>
  <style>
    /* ===== 2026 DESIGN SYSTEM ===== */
    
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .dark {
      color-scheme: dark;
    }

    /* ===== GRADIENT MESH BACKGROUND ===== */
    .gradient-mesh-bg {
      background: 
        radial-gradient(at 40% 20%, hsla(228, 100%, 74%, 0.3) 0px, transparent 50%),
        radial-gradient(at 80% 0%, hsla(189, 100%, 56%, 0.3) 0px, transparent 50%),
        radial-gradient(at 0% 50%, hsla(355, 100%, 93%, 0.2) 0px, transparent 50%),
        radial-gradient(at 80% 50%, hsla(340, 100%, 76%, 0.2) 0px, transparent 50%),
        radial-gradient(at 0% 100%, hsla(269, 100%, 77%, 0.2) 0px, transparent 50%),
        radial-gradient(at 80% 100%, hsla(240, 100%, 70%, 0.2) 0px, transparent 50%),
        radial-gradient(at 0% 0%, hsla(343, 100%, 76%, 0.2) 0px, transparent 50%);
      background-size: 100% 100%;
      animation: gradient-xy 15s ease infinite;
    }

    .dark .gradient-mesh-bg {
      background: 
        radial-gradient(at 40% 20%, hsla(228, 100%, 20%, 0.4) 0px, transparent 50%),
        radial-gradient(at 80% 0%, hsla(189, 100%, 15%, 0.4) 0px, transparent 50%),
        radial-gradient(at 0% 50%, hsla(355, 100%, 10%, 0.3) 0px, transparent 50%),
        radial-gradient(at 80% 50%, hsla(340, 100%, 15%, 0.3) 0px, transparent 50%),
        radial-gradient(at 0% 100%, hsla(269, 100%, 20%, 0.3) 0px, transparent 50%),
        radial-gradient(at 80% 100%, hsla(240, 100%, 15%, 0.3) 0px, transparent 50%),
        radial-gradient(at 0% 0%, hsla(343, 100%, 15%, 0.3) 0px, transparent 50%);
    }

    /* ===== GLASSMORPHISM ===== */
    .glass-card {
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }

    .dark .glass-card {
      background: rgba(30, 30, 30, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    /* ===== MICRO-INTERACTIONS ===== */
    .hover-lift {
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), 
                  box-shadow 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .hover-lift:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
    }

    .dark .hover-lift:hover {
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .hover-scale {
      transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .hover-scale:hover {
      transform: scale(1.05);
    }

    /* Ripple effect */
    .ripple {
      position: relative;
      overflow: hidden;
    }

    .ripple::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
      background-image: radial-gradient(circle, rgba(255, 255, 255, 0.3) 10%, transparent 10.01%);
      background-repeat: no-repeat;
      background-position: 50%;
      transform: scale(10, 10);
      opacity: 0;
      transition: transform 0.5s, opacity 1s;
    }

    .ripple:active::after {
      transform: scale(0, 0);
      opacity: 0.3;
      transition: 0s;
    }

    /* ===== INPUT FOCUS GLOW ===== */
    .input-glow:focus {
      outline: none;
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.2),
                  0 0 20px rgba(124, 58, 237, 0.1);
    }

    .dark .input-glow:focus {
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.3),
                  0 0 20px rgba(124, 58, 237, 0.2);
    }

    /* ===== CUSTOM SCROLLBAR ===== */
    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #cbd5e1, #94a3b8);
      border-radius: 10px;
      border: 2px solid transparent;
      background-clip: padding-box;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, #94a3b8, #64748b);
    }

    .dark ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #475569, #334155);
    }

    .dark ::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, #334155, #1e293b);
    }

    /* ===== REDUCED MOTION ===== */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }

      .gradient-mesh-bg {
        animation: none;
      }
    }
  </style>
</head>
<body class="bg-gray-50 dark:bg-[#0a0a0a] min-h-screen flex items-center justify-center px-4 py-8 gradient-mesh-bg text-gray-900 dark:text-white">
  <div class="w-full max-w-md glass-card p-8 rounded-2xl shadow-lg animate-scale-in">

    <h2 class="text-2xl font-semibold mb-6 text-center">Reset Password</h2>

    <form id="reset-form" class="space-y-5">
      <div>
        <label class="block text-sm mb-1 text-gray-600 dark:text-gray-300">New Password</label>
        <input type="password" id="new-password1" class="w-full p-3 bg-gray-50 dark:bg-[#2a2a2a] border border-gray-200 dark:border-[#3a3a3a] rounded-lg text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-purple-600 input-glow" required>
      </div>
      <div>
        <label class="block text-sm mb-1 text-gray-600 dark:text-gray-300">Confirm Password</label>
        <input type="password" id="new-password2" class="w-full p-3 bg-gray-50 dark:bg-[#2a2a2a] border border-gray-200 dark:border-[#3a3a3a] rounded-lg text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-purple-600 input-glow" required>
      </div>
      <button type="submit" class="w-full bg-gradient-to-r from-purple-600 to-violet-600 hover:from-purple-500 hover:to-violet-500 py-3 rounded font-semibold hover-lift ripple shadow-lg shadow-purple-500/30">
        Reset Password
      </button>
    </form>

    <p id="message" class="mt-4 text-sm text-center text-gray-500 dark:text-gray-400"></p>

    <div class="text-center mt-6">
      <a href="/login" class="text-purple-600 dark:text-purple-400 hover:underline text-sm hover-scale">Back to Login</a>
    </div>
  </div>

  <script src="{%static 'js/authenticate/password-reset.js'%}"></script>
</body>
</html>
