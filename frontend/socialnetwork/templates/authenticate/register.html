{% load static %}
<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng ký — SocialNetwork</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
          },
          colors: {
            primary: {
              50: '#f5f3ff',
              100: '#ede9fe',
              200: '#ddd6fe',
              300: '#c4b5fd',
              400: '#a78bfa',
              500: '#8b5cf6',
              600: '#7c3aed',
              700: '#6d28d9',
              800: '#5b21b6',
              900: '#4c1d95',
            },
            'oklch': {
              primary: 'oklch(0.65 0.19 250)',
              secondary: 'oklch(0.85 0.05 250)',
              accent: 'oklch(0.7 0.15 320)',
              success: 'oklch(0.7 0.17 142)',
              warning: 'oklch(0.8 0.15 85)',
              error: 'oklch(0.65 0.2 25)',
            }
          },
          animation: {
            'gradient-x': 'gradient-x 15s ease infinite',
            'gradient-y': 'gradient-y 15s ease infinite',
            'gradient-xy': 'gradient-xy 15s ease infinite',
            'float': 'float 6s ease-in-out infinite',
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'bounce-slow': 'bounce 2s infinite',
            'slide-up': 'slideUp 0.5s ease-out',
            'scale-in': 'scaleIn 0.3s ease-out',
            'fade-in': 'fadeIn 0.3s ease-in',
            'shake': 'shake 0.5s ease-in-out',
          },
          keyframes: {
            'gradient-x': {
              '0%, 100%': {
                'background-size': '200% 200%',
                'background-position': 'left center'
              },
              '50%': {
                'background-size': '200% 200%',
                'background-position': 'right center'
              },
            },
            'gradient-y': {
              '0%, 100%': {
                'background-size': '200% 200%',
                'background-position': 'center top'
              },
              '50%': {
                'background-size': '200% 200%',
                'background-position': 'center bottom'
              },
            },
            'gradient-xy': {
              '0%, 100%': {
                'background-size': '400% 400%',
                'background-position': 'left center'
              },
              '50%': {
                'background-size': '400% 400%',
                'background-position': 'right center'
              },
            },
            'float': {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-20px)' },
            },
            'slideUp': {
              '0%': { transform: 'translateY(20px)', opacity: '0' },
              '100%': { transform: 'translateY(0)', opacity: '1' },
            },
            'scaleIn': {
              '0%': { transform: 'scale(0.9)', opacity: '0' },
              '100%': { transform: 'scale(1)', opacity: '1' },
            },
            'fadeIn': {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            'shake': {
              '0%, 100%': { transform: 'translateX(0)' },
              '10%, 30%, 50%, 70%, 90%': { transform: 'translateX(-5px)' },
              '20%, 40%, 60%, 80%': { transform: 'translateX(5px)' },
            },
          },
        }
      }
    }
  </script>
  <script>
    try {
      var _fbDark = localStorage.getItem('fb_darkmode') === '1';
      document.documentElement.classList.toggle('dark', _fbDark);
    } catch (e) { }
  </script>
  <style>
    /* ===== 2026 DESIGN SYSTEM ===== */
    
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .dark {
      color-scheme: dark;
    }

    /* ===== GRADIENT MESH BACKGROUND ===== */
    .gradient-mesh-bg {
      background: 
        radial-gradient(at 40% 20%, hsla(228, 100%, 74%, 0.3) 0px, transparent 50%),
        radial-gradient(at 80% 0%, hsla(189, 100%, 56%, 0.3) 0px, transparent 50%),
        radial-gradient(at 0% 50%, hsla(355, 100%, 93%, 0.2) 0px, transparent 50%),
        radial-gradient(at 80% 50%, hsla(340, 100%, 76%, 0.2) 0px, transparent 50%),
        radial-gradient(at 0% 100%, hsla(269, 100%, 77%, 0.2) 0px, transparent 50%),
        radial-gradient(at 80% 100%, hsla(240, 100%, 70%, 0.2) 0px, transparent 50%),
        radial-gradient(at 0% 0%, hsla(343, 100%, 76%, 0.2) 0px, transparent 50%);
      background-size: 100% 100%;
      animation: gradient-xy 15s ease infinite;
    }

    .dark .gradient-mesh-bg {
      background: 
        radial-gradient(at 40% 20%, hsla(228, 100%, 20%, 0.4) 0px, transparent 50%),
        radial-gradient(at 80% 0%, hsla(189, 100%, 15%, 0.4) 0px, transparent 50%),
        radial-gradient(at 0% 50%, hsla(355, 100%, 10%, 0.3) 0px, transparent 50%),
        radial-gradient(at 80% 50%, hsla(340, 100%, 15%, 0.3) 0px, transparent 50%),
        radial-gradient(at 0% 100%, hsla(269, 100%, 20%, 0.3) 0px, transparent 50%),
        radial-gradient(at 80% 100%, hsla(240, 100%, 15%, 0.3) 0px, transparent 50%),
        radial-gradient(at 0% 0%, hsla(343, 100%, 15%, 0.3) 0px, transparent 50%);
    }

    /* ===== GLASSMORPHISM ===== */
    .glass {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .dark .glass {
      background: rgba(30, 30, 30, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }

    .dark .glass-card {
      background: rgba(30, 30, 30, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    /* ===== MICRO-INTERACTIONS ===== */
    .hover-lift {
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), 
                  box-shadow 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .hover-lift:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
    }

    .dark .hover-lift:hover {
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .hover-scale {
      transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .hover-scale:hover {
      transform: scale(1.05);
    }

    /* Ripple effect */
    .ripple {
      position: relative;
      overflow: hidden;
    }

    .ripple::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
      background-image: radial-gradient(circle, rgba(255, 255, 255, 0.3) 10%, transparent 10.01%);
      background-repeat: no-repeat;
      background-position: 50%;
      transform: scale(10, 10);
      opacity: 0;
      transition: transform 0.5s, opacity 1s;
    }

    .ripple:active::after {
      transform: scale(0, 0);
      opacity: 0.3;
      transition: 0s;
    }

    /* ===== INPUT FOCUS GLOW ===== */
    .input-glow:focus {
      outline: none;
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.2),
                  0 0 20px rgba(124, 58, 237, 0.1);
    }

    .dark .input-glow:focus {
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.3),
                  0 0 20px rgba(124, 58, 237, 0.2);
    }

    /* ===== CUSTOM SCROLLBAR ===== */
    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #cbd5e1, #94a3b8);
      border-radius: 10px;
      border: 2px solid transparent;
      background-clip: padding-box;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, #94a3b8, #64748b);
    }

    .dark ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #475569, #334155);
    }

    .dark ::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, #334155, #1e293b);
    }

    /* ===== REDUCED MOTION ===== */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }

      .gradient-mesh-bg {
        animation: none;
      }
    }

    /* ===== EXISTING REGISTER STYLES ===== */
    /* Modern design enhancements */
    .glass-effect {
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .animate-fade-in {
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ---- Base input ---- */
    .field-wrap {
      position: relative;
    }

    .field-icon {
      position: absolute;
      left: .75rem;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: #6b7280;
    }

    .dark .field-icon {
      color: #9ca3af;
    }

    .field-input {
      width: 100%;
      padding: .75rem 1rem .75rem 2.75rem;
      background: #f9fafb;
      color: #111827;
      border: 1.5px solid #e5e7eb;
      border-radius: .75rem;
      outline: none;
      font-size: .9rem;
      transition: border-color .2s, box-shadow .2s;
    }

    .field-input:focus {
      border-color: #7c3aed;
      box-shadow: 0 0 0 3px rgba(124, 58, 237, .18);
    }

    .field-input::placeholder {
      color: #9ca3af;
    }

    .dark .field-input {
      background: #1f2937;
      color: #f3f4f6;
      border-color: #374151;
    }

    .dark .field-input:focus {
      border-color: #a78bfa;
      box-shadow: 0 0 0 3px rgba(167, 139, 250, .18);
    }

    .field-input.no-icon {
      padding-left: 1rem;
    }

    /* ---- Phone row ---- */
    .phone-row {
      display: flex;
      gap: 8px;
      align-items: stretch;
    }

    .cc-wrap {
      position: relative;
      flex: 0 0 140px;
    }

    .cc-select {
      width: 100%;
      height: 100%;
      padding: .75rem 2rem .75rem .75rem;
      background: #f9fafb;
      color: #111827;
      border: 1.5px solid #e5e7eb;
      border-radius: .75rem;
      outline: none;
      appearance: none;
      font-size: .85rem;
      cursor: pointer;
      transition: border-color .2s;
    }

    .cc-select:focus {
      border-color: #7c3aed;
      box-shadow: 0 0 0 3px rgba(124, 58, 237, .18);
    }

    .dark .cc-select {
      background: #1f2937;
      color: #f3f4f6;
      border-color: #374151;
    }

    .dark .cc-select:focus {
      border-color: #a78bfa;
    }

    .cc-arrow {
      position: absolute;
      right: .75rem;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: #9ca3af;
    }

    /* ---- Password toggle ---- */
    .pw-toggle {
      position: absolute;
      right: .75rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #9ca3af;
      font-size: 1rem;
      padding: 0;
      line-height: 1;
    }

    .pw-toggle:hover {
      color: #6b7280;
    }

    .dark .pw-toggle:hover {
      color: #d1d5db;
    }

    .has-toggle {
      padding-right: 2.75rem !important;
    }

    /* ---- Strength bar ---- */
    .s-bar-bg {
      height: 4px;
      border-radius: 4px;
      background: #e5e7eb;
      overflow: hidden;
      margin-top: 4px;
    }

    .dark .s-bar-bg {
      background: #374151;
    }

    .s-bar {
      height: 100%;
      border-radius: 4px;
      transition: width .3s, background .3s;
    }

    /* ---- Error ---- */
    #regError {
      display: none;
      background: rgba(239, 68, 68, .1);
      border: 1px solid rgba(239, 68, 68, .3);
      color: #dc2626;
      border-radius: .75rem;
      padding: .75rem 1rem;
      font-size: .875rem;
      margin-bottom: .75rem;
      white-space: pre-line;
    }

    .dark #regError {
      background: rgba(239, 68, 68, .15);
      border-color: rgba(239, 68, 68, .4);
      color: #fca5a5;
    }

    #regError.show {
      display: block;
    }

    /* ---- Submit ---- */
    .btn-submit {
      width: 100%;
      padding: .875rem;
      border-radius: .75rem;
      font-weight: 600;
      font-size: .95rem;
      cursor: pointer;
      background: linear-gradient(135deg, #7c3aed, #6d28d9);
      color: #fff;
      border: none;
      transition: all .2s;
      box-shadow: 0 4px 14px rgba(124, 58, 237, .3);
    }

    .btn-submit:hover {
      opacity: .95;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(124, 58, 237, .4);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    .btn-submit:disabled {
      opacity: .5;
      cursor: not-allowed;
      transform: none;
    }

    /* ---- Card ---- */
    .card {
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid #e5e7eb;
      border-radius: 1.5rem;
      box-shadow: 0 0 80px rgba(109, 40, 217, .1), 0 24px 64px rgba(0, 0, 0, .1);
    }

    .dark .card {
      background: rgba(31, 41, 55, 0.95);
      border-color: #374151;
      box-shadow: 0 0 80px rgba(109, 40, 217, .15), 0 24px 64px rgba(0, 0, 0, .5);
    }

    /* Theme toggle */
    .theme-toggle {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 50;
      padding: .5rem;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid #e5e7eb;
      cursor: pointer;
      transition: all .2s;
    }

    .dark .theme-toggle {
      background: rgba(31, 41, 55, 0.9);
      border-color: #374151;
    }

    .theme-toggle:hover {
      transform: scale(1.1);
    }
  </style>
</head>

<body class="bg-gray-50 dark:bg-[#0a0a0a] min-h-screen flex items-center justify-center px-4 py-10 text-gray-900 dark:text-white transition-colors gradient-mesh-bg">
  <!-- Theme Toggle -->
  <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle theme">
    <svg class="w-6 h-6 text-gray-700 dark:text-yellow-400" id="themeIcon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
    </svg>
  </button>

  <div class="w-full max-w-md glass-card card p-8 animate-fade-in">

    <!-- Brand -->
    <div class="text-center mb-7">
      <div
        class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-br from-violet-500 to-purple-600 mb-4 shadow-lg shadow-violet-500/30">
        <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8h2a2 2 0 012 2v6a2 2 0 01-2 2h-2v4l-4-4H9a1.994 1.994 0 01-1.414-.586m0 0L11 14h4a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2v4l.586-.586z"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Tạo tài khoản</h1>
      <p class="text-gray-500 dark:text-gray-400 text-sm mt-2">Miễn phí · Nhanh chóng · Bảo mật</p>
    </div>

    <!-- Error -->
    <div id="regError" role="alert"></div>

    <form id="registerForm" novalidate class="space-y-4">

      <!-- Họ / Tên -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs text-gray-500 dark:text-gray-400 font-medium mb-1.5" for="rFirstName">Họ</label>
          <div class="field-wrap">
            <svg class="field-icon w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
            <input type="text" id="rFirstName" name="firstname" placeholder="Nguyễn" autocomplete="given-name"
              class="field-input" required>
          </div>
        </div>
        <div>
          <label class="block text-xs text-gray-500 dark:text-gray-400 font-medium mb-1.5" for="rLastName">Tên</label>
          <div class="field-wrap">
            <svg class="field-icon w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
            <input type="text" id="rLastName" name="lastname" placeholder="Văn A" autocomplete="family-name"
              class="field-input" required>
          </div>
        </div>
      </div>

      <!-- Email -->
      <div>
        <label class="block text-xs text-gray-500 dark:text-gray-400 font-medium mb-1.5" for="rEmail">Email</label>
        <div class="field-wrap">
          <svg class="field-icon w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
          </svg>
          <input type="email" id="rEmail" name="email" placeholder="example@email.com" autocomplete="email"
            class="field-input" required>
        </div>
      </div>

      <!-- Số điện thoại — E.164 -->
      <div>
        <label class="block text-xs text-gray-500 dark:text-gray-400 font-medium mb-1.5">Số điện thoại</label>
        <div class="phone-row">
          <div class="cc-wrap">
            <select id="rCountryCode" class="cc-select">
              <!-- Châu Á -->
              <optgroup label="─── Phổ biến ───">
                <option value="+84" data-len="9" selected>🇻🇳 +84</option>
                <option value="+1" data-len="10">🇺🇸 +1</option>
                <option value="+44" data-len="10">🇬🇧 +44</option>
                <option value="+81" data-len="10">🇯🇵 +81</option>
                <option value="+82" data-len="10">🇰🇷 +82</option>
                <option value="+65" data-len="8">🇸🇬 +65</option>
              </optgroup>
              <optgroup label="─── Đông Nam Á ───">
                <option value="+60" data-len="10">🇲🇾 +60</option>
                <option value="+62" data-len="11">🇮🇩 +62</option>
                <option value="+63" data-len="10">🇵🇭 +63</option>
                <option value="+66" data-len="9">🇹🇭 +66</option>
              </optgroup>
              <optgroup label="─── Đông Á ───">
                <option value="+86" data-len="11">🇨🇳 +86</option>
                <option value="+852" data-len="8">🇭🇰 +852</option>
                <option value="+886" data-len="9">🇹🇼 +886</option>
              </optgroup>
              <optgroup label="─── Châu Âu ───">
                <option value="+33" data-len="9">🇫🇷 +33</option>
                <option value="+49" data-len="11">🇩🇪 +49</option>
                <option value="+39" data-len="10">🇮🇹 +39</option>
                <option value="+34" data-len="9">🇪🇸 +34</option>
              </optgroup>
              <optgroup label="─── Khác ───">
                <option value="+61" data-len="9">🇦🇺 +61</option>
                <option value="+91" data-len="10">🇮🇳 +91</option>
                <option value="+55" data-len="11">🇧🇷 +55</option>
                <option value="+7" data-len="10">🇷🇺 +7</option>
              </optgroup>
            </select>
            <svg class="cc-arrow w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>
          </div>
          <div class="field-wrap flex-1">
            <svg class="field-icon w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
            </svg>
            <input type="tel" id="rPhone" placeholder="901 234 567" autocomplete="tel-national"
              class="field-input" required>
          </div>
        </div>
        <p id="phoneHint" class="text-xs text-gray-500 dark:text-gray-400 mt-1.5">
          Nhập số <strong class="text-gray-700 dark:text-gray-300">không</strong> kèm mã quốc gia — VD: <span id="phoneExample" class="text-gray-700 dark:text-gray-300">901 234 567</span>
        </p>
      </div>

      <!-- Ngày sinh -->
      <div>
        <label class="block text-xs text-gray-500 dark:text-gray-400 font-medium mb-1.5" for="rBirthday">Ngày sinh</label>
        <div class="field-wrap">
          <svg class="field-icon w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
          </svg>
          <input type="date" id="rBirthday" name="birthday" max="{{ today }}" class="field-input" required>
        </div>
      </div>

      <!-- Mật khẩu -->
      <div>
        <label class="block text-xs text-gray-500 dark:text-gray-400 font-medium mb-1.5" for="rPw1">Mật khẩu</label>
        <div class="field-wrap">
          <svg class="field-icon w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
          </svg>
          <input type="password" id="rPw1" name="password1" placeholder="Tối thiểu 8 ký tự" autocomplete="new-password"
            class="field-input has-toggle" required>
          <button type="button" class="pw-toggle" data-target="rPw1">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
            </svg>
          </button>
        </div>
        <div class="s-bar-bg">
          <div id="sBar" class="s-bar" style="width:0"></div>
        </div>
        <p id="sLabel" class="text-xs mt-1 text-gray-500 dark:text-gray-400 h-4"></p>
      </div>

      <!-- Nhập lại -->
      <div>
        <label class="block text-xs text-gray-500 dark:text-gray-400 font-medium mb-1.5" for="rPw2">Nhập lại mật khẩu</label>
        <div class="field-wrap">
          <svg class="field-icon w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
          </svg>
          <input type="password" id="rPw2" name="password2" placeholder="Nhập lại mật khẩu" autocomplete="new-password"
            class="field-input has-toggle" required>
          <button type="button" class="pw-toggle" data-target="rPw2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
            </svg>
          </button>
        </div>
        <p id="matchHint" class="text-xs mt-1 text-gray-500 dark:text-gray-400 h-4"></p>
      </div>

      <button type="submit" id="submitBtn" class="btn-submit mt-2 hover-lift ripple">Đăng ký</button>
    </form>

    <p class="text-center text-sm text-gray-500 dark:text-gray-400 mt-6">
      Đã có tài khoản?
      <a href="/login" class="text-violet-600 dark:text-violet-400 hover:text-violet-700 dark:hover:text-violet-300 font-semibold hover:underline transition-colors">Đăng nhập</a>
    </p>
  </div>

  <script type="module" src="{% static 'js/authenticate/register.js' %}"></script>

  <script>
    /* ===== UX helpers (inline, no auth logic) ===== */

    // Password visibility toggle
    document.querySelectorAll('.pw-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        const inp = document.getElementById(btn.dataset.target);
        if (!inp) return;
        inp.type = inp.type === 'password' ? 'text' : 'password';
        // Toggle between eye and eye-off icons
        const eyePath = btn.querySelector('path');
        if (inp.type === 'password') {
          eyePath.setAttribute('d', 'M15 12a3 3 0 11-6 0 3 3 0 016 0z M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z');
        } else {
          eyePath.setAttribute('d', 'M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21');
        }
      });
    });

    // Theme toggle
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    
    themeToggle?.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      const isDark = document.documentElement.classList.contains('dark');
      localStorage.setItem('fb_darkmode', isDark ? '1' : '0');
      
      // Update icon
      if (isDark) {
        themeIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>';
      } else {
        themeIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>';
      }
    });

    // Password strength
    const pw1El = document.getElementById('rPw1');
    const sBar = document.getElementById('sBar');
    const sLabel = document.getElementById('sLabel');
    const STRENGTHS = [
      { pct: '20%', color: '#ef4444', label: 'Rất yếu' },
      { pct: '40%', color: '#f97316', label: 'Yếu' },
      { pct: '60%', color: '#eab308', label: 'Trung bình' },
      { pct: '80%', color: '#22c55e', label: 'Mạnh' },
      { pct: '100%', color: '#10b981', label: 'Rất mạnh' },
    ];
    function calcStrength(v) {
      let s = 0;
      if (v.length >= 8) s++;
      if (v.length >= 12) s++;
      if (/[A-Z]/.test(v)) s++;
      if (/[0-9]/.test(v)) s++;
      if (/[^A-Za-z0-9]/.test(v)) s++;
      return Math.min(s, 4);
    }
    pw1El.addEventListener('input', () => {
      const v = pw1El.value;
      if (!v) { sBar.style.width = '0'; sLabel.textContent = ''; return; }
      const st = STRENGTHS[calcStrength(v)];
      sBar.style.width = st.pct; sBar.style.background = st.color;
      sLabel.textContent = st.label; sLabel.style.color = st.color;
    });

    // Match hint
    const pw2El = document.getElementById('rPw2');
    const matchHint = document.getElementById('matchHint');
    pw2El.addEventListener('input', () => {
      if (!pw2El.value) { matchHint.textContent = ''; return; }
      const ok = pw1El.value === pw2El.value;
      matchHint.textContent = ok ? '✓ Mật khẩu khớp' : '✗ Chưa khớp';
      matchHint.style.color = ok ? '#22c55e' : '#ef4444';
    });

    // Country code → update phone placeholder/hint
    const ccSel = document.getElementById('rCountryCode');
    const phoneInp = document.getElementById('rPhone');
    const phoneExample = document.getElementById('phoneExample');
    const EXAMPLES = {
      '+84': '901 234 567', '+1': '(201) 555-0123', '+44': '7911 123456',
      '+81': '90-1234-5678', '+82': '10-1234-5678', '+65': '8123 4567',
      '+60': '12-3456789', '+62': '812-3456789', '+63': '917 123 4567',
      '+66': '81 234 5678', '+86': '138 0013 8000', '+852': '5123 4567',
      '+886': '912 345 678', '+33': '6 12 34 56 78', '+49': '151 12345678',
      '+39': '320 123 4567', '+34': '612 345 678', '+61': '412 345 678',
      '+91': '98765 43210', '+55': '11 91234-5678', '+7': '912 345-67-89',
    };
    ccSel.addEventListener('change', () => {
      const ex = EXAMPLES[ccSel.value] || '912 345 678';
      phoneExample.textContent = ex;
      phoneInp.placeholder = ex;
    });
  </script>
</body>

</html>
