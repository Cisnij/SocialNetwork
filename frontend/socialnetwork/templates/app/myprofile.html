{% extends 'app/base.html' %}
{% load static %}

{% block title %}Trang cá nhân{% endblock %}
{% block profile %}
<div class="bg-white dark:bg-gray-800 shadow-sm">
  <div id="profile" class="max-w-4xl mx-auto px-4 pt-8 pb-4 flex flex-col items-center"></div>
  <nav id="tabs" class="max-w-4xl mx-auto flex justify-center gap-1 px-4 border-t dark:border-gray-700 text-sm font-semibold overflow-x-auto">
    <a href="#" data-tab="posts" class="tab-active px-4 py-3 border-b-2 border-fb-primary text-fb-primary whitespace-nowrap">Bài viết</a>
    <a href="#" data-tab="shares" class="px-4 py-3 text-gray-500 hover:bg-fb-secondary dark:hover:bg-gray-700 rounded-t-lg whitespace-nowrap">Chia sẻ</a>
    <a href="#" data-tab="friends" class="px-4 py-3 text-gray-500 hover:bg-fb-secondary dark:hover:bg-gray-700 rounded-t-lg whitespace-nowrap">Bạn bè</a>
    <a href="#" data-tab="photos" class="px-4 py-3 text-gray-500 hover:bg-fb-secondary dark:hover:bg-gray-700 rounded-t-lg whitespace-nowrap">Ảnh</a>
    <a href="#" data-tab="following" id="tabFollowing" class="hidden px-4 py-3 text-gray-500 hover:bg-fb-secondary dark:hover:bg-gray-700 rounded-t-lg whitespace-nowrap">Đang theo dõi</a>
    <a href="#" data-tab="followers" id="tabFollowers" class="hidden px-4 py-3 text-gray-500 hover:bg-fb-secondary dark:hover:bg-gray-700 rounded-t-lg whitespace-nowrap">Người theo dõi</a>
  </nav>
</div>

<div id="content" class="max-w-2xl mx-auto px-4 py-6 space-y-4"></div>

<div id="avatarModal" class="hidden fixed inset-0 bg-black/70 flex justify-center items-center z-50 p-4">
  <img id="avatarModalImg" class="max-h-[90%] max-w-[90%] rounded-lg shadow-lg" src="" alt="Avatar">
</div>
<div id="photoModal" class="hidden fixed inset-0 bg-black/95 z-[60] flex items-center justify-center">
  <button id="closeModal" type="button" class="absolute top-4 right-4 text-white text-4xl">&times;</button>
  <button id="prevPhoto" type="button" class="absolute left-4 text-white text-5xl">‹</button>
  <img id="photoModalImg" alt="" class="max-h-[90vh] max-w-[90vw] object-contain">
  <button id="nextPhoto" type="button" class="absolute right-4 text-white text-5xl">›</button>
  <p id="photoModalCaption" class="absolute bottom-6 text-white text-center w-full text-sm"></p>
</div>
{% endblock profile %}

{% block post_scripts %}
<script>window.user_id = "{{ user_id }}";</script>
<script type="module" src="{% static 'js/userpage/userpage.js' %}"></script>
<script type="module" src="{% static 'js/app/add_post.js' %}"></script>
{% endblock post_scripts %}
