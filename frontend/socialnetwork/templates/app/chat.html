{% extends 'app/base.html' %}
{% load static %}
{% block title %}Messenger{% endblock %}
{% block main_content %}
<div id="chatPageRoot" data-page="chat" class="max-w-[1400px] mx-auto h-[calc(100vh-3.5rem)] flex bg-white dark:bg-gradient-to-br dark:from-slate-900 dark:to-black shadow-sm dark:shadow-2xl md:rounded-lg overflow-hidden md:mt-2">
  <aside class="w-full md:w-[360px] border-r dark:border-white/10 flex flex-col bg-white dark:bg-white/5 dark:backdrop-blur-xl">
    <div class="p-3 border-b dark:border-white/10 flex justify-between items-center bg-white/50 dark:bg-transparent">
      <h1 class="text-xl font-bold dark:text-white drop-shadow-sm">Messenger</h1>
      <button type="button" id="showHiddenChats" class="text-sm text-fb-primary dark:text-indigo-400 font-semibold hover:underline">Đã ẩn</button>
    </div>
    <!-- Friends strip (start new chat) -->
    <div class="border-b dark:border-white/10 py-3">
      <p class="px-3 text-xs font-semibold text-gray-500 dark:text-slate-400 mb-2 uppercase tracking-wide drop-shadow-sm">Bạn bè</p>
      <div id="chatFriendsStrip" class="flex gap-3 overflow-x-auto px-3 pb-1 scrollbar-thin"></div>
    </div>
    <p class="px-3 py-2 text-xs font-semibold text-gray-500 dark:text-slate-400 uppercase tracking-wide drop-shadow-sm">Tin nhắn</p>
    <div id="chatConvList" class="flex-1 overflow-y-auto scrollbar-thin"></div>
  </aside>
  <section id="chatPanel" class="hidden md:flex flex-1 flex-col min-w-0 absolute md:relative inset-0 md:inset-auto z-10 bg-fb-bg dark:bg-transparent">
    <div id="chatHeader" class="p-3 border-b dark:border-white/10 flex items-center justify-between bg-white dark:bg-white/5 dark:backdrop-blur-xl z-20">
      <p id="chatTitle" class="font-bold dark:text-white drop-shadow-sm">Chọn hội thoại</p>
      <div id="chatHeaderActions" class="flex gap-2"></div>
    </div>
    <div id="chatPendingBanner" class="hidden p-3 bg-amber-50 dark:bg-amber-500/20 dark:backdrop-blur-md border-b dark:border-amber-500/30 flex gap-2 flex-wrap text-amber-900 dark:text-amber-100 shadow-inner"></div>
    <div id="chatMessages" class="flex-1 overflow-y-auto p-4 space-y-1 z-10 relative">
      <!-- Background pattern overlay -->
      <div class="absolute inset-0 pointer-events-none hidden dark:block bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-[0.03] mix-blend-overlay"></div>
    </div>
    <form id="chatForm" class="p-3 border-t dark:border-white/10 flex gap-2 items-end bg-white dark:bg-white/5 dark:backdrop-blur-xl z-20">
      <label class="cursor-pointer p-2 rounded-full hover:bg-fb-secondary dark:hover:bg-white/10 transition-colors dark:text-slate-300" title="Đính kèm">
        📎
        <input type="file" id="chatFileInput" multiple class="hidden">
      </label>
      <input id="chatInput" type="text" placeholder="Aa" class="flex-1 rounded-full px-4 py-2.5 bg-fb-secondary dark:bg-black/40 dark:text-white dark:placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all border border-transparent dark:border-white/10 shadow-inner">
      <button type="submit" class="p-2.5 rounded-full bg-fb-primary dark:bg-gradient-to-r dark:from-blue-600 dark:to-indigo-600 text-white hover:bg-fb-primary-hover dark:hover:from-blue-500 dark:hover:to-indigo-500 shadow-md dark:shadow-indigo-500/25 transition-all" aria-label="Gửi">➤</button>
    </form>
  </section>
</div>
<div id="hiddenChatsModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
  <div class="bg-white dark:bg-[#242526] rounded-xl w-full max-w-md max-h-[70vh] flex flex-col">
    <div class="p-4 border-b dark:border-fb-divider flex justify-between"><h2 class="font-bold dark:text-fb-text">Tin nhắn đã ẩn</h2><button type="button" id="closeHiddenChats" class="text-2xl">&times;</button></div>
    <div id="hiddenChatsList" class="overflow-y-auto p-2 flex-1"></div>
  </div>
</div>
{% endblock %}
{% block post_scripts %}
<script type="module" src="{% static 'js/pages/chat.js' %}"></script>
{% endblock %}
