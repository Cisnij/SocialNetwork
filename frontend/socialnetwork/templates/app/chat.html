{% extends 'app/base.html' %}
{% load static %}
{% block title %}Messenger{% endblock %}
{% block main_content %}
<div class="max-w-[1400px] mx-auto h-[calc(100vh-3.5rem)] flex bg-white dark:bg-gray-800 shadow-sm">
  <aside class="w-full md:w-[360px] border-r dark:border-gray-700 flex flex-col">
    <div class="p-3 border-b dark:border-gray-700 flex justify-between items-center">
      <h1 class="text-xl font-bold">Đoạn chat</h1>
      <button type="button" id="showHiddenChats" class="text-sm text-fb-primary font-semibold">Đã ẩn</button>
    </div>
    <div id="chatConvList" class="flex-1 overflow-y-auto scrollbar-thin"></div>
  </aside>
  <section id="chatPanel" class="hidden md:flex flex-1 flex-col min-w-0 absolute md:relative inset-0 md:inset-auto z-10 bg-white dark:bg-gray-800">
    <div id="chatHeader" class="p-3 border-b dark:border-gray-700 flex items-center justify-between">
      <p id="chatTitle" class="font-bold">Chọn hội thoại</p>
      <div id="chatHeaderActions" class="flex gap-2"></div>
    </div>
    <div id="chatPendingBanner" class="hidden p-3 bg-amber-50 dark:bg-amber-900/30 border-b flex gap-2"></div>
    <div id="chatMessages" class="flex-1 overflow-y-auto p-4 bg-fb-bg dark:bg-gray-900 space-y-1"></div>
    <form id="chatForm" class="p-3 border-t dark:border-gray-700 flex gap-2 items-end">
      <label class="cursor-pointer p-2 rounded-full hover:bg-fb-secondary">
        📎
        <input type="file" id="chatFileInput" multiple class="hidden">
      </label>
      <input id="chatInput" type="text" placeholder="Aa" class="flex-1 rounded-full px-4 py-2 bg-fb-secondary dark:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-fb-primary">
      <button type="submit" class="p-2 rounded-full bg-fb-primary text-white">➤</button>
    </form>
  </section>
</div>
<div id="hiddenChatsModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
  <div class="bg-white dark:bg-gray-800 rounded-xl w-full max-w-md max-h-[70vh] flex flex-col">
    <div class="p-4 border-b flex justify-between"><h2 class="font-bold">Tin nhắn đã ẩn</h2><button type="button" id="closeHiddenChats">&times;</button></div>
    <div id="hiddenChatsList" class="overflow-y-auto p-2 flex-1"></div>
  </div>
</div>
{% endblock %}
{% block post_scripts %}
<script type="module" src="{% static 'js/pages/chat.js' %}"></script>
{% endblock %}
