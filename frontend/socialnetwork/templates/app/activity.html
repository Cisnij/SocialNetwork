{% extends 'app/page-shell.html' %}
{% load static %}
{% block title %}Hoạt động{% endblock %}
{% block page_content %}
<div class="max-w-2xl mx-auto">
  <h1 class="text-2xl font-bold mb-6 dark:text-[#e4e6eb]">Hoạt động gần đây</h1>
  
  <div class="bg-white dark:bg-[#242526] rounded-xl shadow-sm overflow-hidden">
    <!-- Activity filters -->
    <div class="flex gap-2 p-4 border-b dark:border-fb-divider">
      <button data-activity-filter="all" class="activity-filter px-4 py-2 rounded-lg text-sm font-medium bg-fb-primary dark:bg-[#1877f2] text-white">Tất cả</button>
      <button data-activity-filter="posts" class="activity-filter px-4 py-2 rounded-lg text-sm font-medium text-gray-600 dark:text-fb-muted hover:bg-fb-secondary dark:hover:bg-[#3a3b3c]">Bài viết</button>
      <button data-activity-filter="comments" class="activity-filter px-4 py-2 rounded-lg text-sm font-medium text-gray-600 dark:text-fb-muted hover:bg-fb-secondary dark:hover:bg-[#3a3b3c]">Bình luận</button>
      <button data-activity-filter="likes" class="activity-filter px-4 py-2 rounded-lg text-sm font-medium text-gray-600 dark:text-fb-muted hover:bg-fb-secondary dark:hover:bg-[#3a3b3c]">Lượt thích</button>
      <button data-activity-filter="friends" class="activity-filter px-4 py-2 rounded-lg text-sm font-medium text-gray-600 dark:text-fb-muted hover:bg-fb-secondary dark:hover:bg-[#3a3b3c]">Bạn bè</button>
    </div>
    
    <!-- Activity list -->
    <div id="activityList" class="divide-y dark:divide-fb-divider max-h-[60vh] overflow-y-auto"></div>
    
    <!-- Load more button -->
    <div class="p-4 border-t dark:border-fb-divider">
      <button type="button" id="loadMoreActivityBtn" class="w-full py-3 text-sm font-semibold text-fb-primary hover:bg-fb-secondary dark:hover:bg-[#3a3b3c] rounded-lg transition hidden">Xem thêm hoạt động</button>
    </div>
  </div>
  
  <!-- Activity tips -->
  <div class="mt-6 bg-fb-bg dark:bg-[#3a3b3c] rounded-xl p-4 border border-gray-200 dark:border-fb-divider">
    <h3 class="font-semibold text-gray-800 dark:text-[#e4e6eb] mb-2">ℹ️ Giới thiệu</h3>
    <p class="text-sm text-gray-600 dark:text-fb-muted">Theo dõi tất cả hoạt động của bạn và người bạn theo dõi trên mạng xã hội.</p>
  </div>
</div>
{% endblock %}
{% block post_scripts %}
<script type="module" src="{% static 'js/pages/activity.js' %}"></script>
{% endblock %}
