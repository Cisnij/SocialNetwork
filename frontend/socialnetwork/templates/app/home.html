{% extends 'app/base.html' %}
{% load static %}
{% block title %}Trang chủ{% endblock %}
{% block main_content %}
<div class="max-w-[1400px] mx-auto px-2 sm:px-4 py-4 grid grid-cols-1 lg:grid-cols-12 gap-4">
  <!-- Left sidebar -->
  <aside class="hidden lg:block lg:col-span-3 space-y-2 sticky top-16 h-fit">
    <a href="/profile/" id="sidebarProfile" class="flex items-center gap-3 p-2 rounded-lg hover:bg-white dark:hover:bg-gray-800 transition">
      <img id="sidebarAvatar" src="/static/default-avatar.png" class="w-9 h-9 rounded-full object-cover">
      <span id="sidebarName" class="font-semibold text-sm">Trang cá nhân</span>
    </a>
    <a href="/friends/" class="flex items-center gap-3 p-2 rounded-lg hover:bg-white dark:hover:bg-gray-800 text-sm font-medium">
      <span class="text-2xl">👥</span> Bạn bè
    </a>
    <a href="/shares/" class="flex items-center gap-3 p-2 rounded-lg hover:bg-white dark:hover:bg-gray-800 text-sm font-medium">
      <span class="text-2xl">↗️</span> Bài chia sẻ
    </a>
    <a href="/settings/" class="flex items-center gap-3 p-2 rounded-lg hover:bg-white dark:hover:bg-gray-800 text-sm font-medium">
      <span class="text-2xl">⚙️</span> Cài đặt
    </a>
  </aside>

  <!-- Center feed -->
  <main class="lg:col-span-6 space-y-4">
    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm p-4 flex gap-3 items-center cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-750" id="openPostComposer">
      <img id="composerAvatar" src="/static/default-avatar.png" class="w-10 h-10 rounded-full object-cover">
      <div class="flex-1 py-2.5 px-4 rounded-full bg-fb-secondary dark:bg-gray-700 text-gray-500 text-sm">Bạn đang nghĩ gì?</div>
    </div>

    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm overflow-hidden">
      <nav class="flex border-b dark:border-gray-700 text-sm font-semibold">
        <button type="button" data-home-tab="feed" class="flex-1 py-3 border-b-2 border-fb-primary text-fb-primary">Bài viết</button>
        <button type="button" data-home-tab="incoming" class="flex-1 py-3 text-gray-500 dark:text-[#b0b3b8] hover:bg-fb-secondary dark:hover:bg-[#3a3b3c]">Lời mời nhận</button>
        <button type="button" data-home-tab="outgoing" class="flex-1 py-3 text-gray-500 dark:text-[#b0b3b8] hover:bg-fb-secondary dark:hover:bg-[#3a3b3c]">Lời mời đã gửi</button>
      </nav>
      <div id="homeTabFeed" class="p-0">
        <div id="post-container" class="divide-y dark:divide-gray-700"></div>
      </div>
      <div id="homeTabIncoming" class="hidden p-4 space-y-2"></div>
      <div id="homeTabOutgoing" class="hidden p-4 space-y-2"></div>
    </div>
  </main>

  <!-- Right sidebar -->
  <aside class="hidden lg:block lg:col-span-3 space-y-4 sticky top-16 h-fit">
    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm p-4">
      <h3 class="font-bold text-gray-500 text-sm mb-3">Lời mời kết bạn</h3>
      <div id="homeFriendRequests" class="space-y-2"></div>
    </div>
    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm p-4">
      <h3 class="font-bold text-gray-500 text-sm mb-3">Gợi ý kết bạn</h3>
      <div id="homeFriendSuggest" class="space-y-2"></div>
    </div>
  </aside>
</div>
{% endblock %}
{% block post_scripts %}
<script type="module" src="{% static 'js/app/feed.js' %}"></script>
<script type="module" src="{% static 'js/app/home-tabs.js' %}"></script>
<script type="module" src="{% static 'js/app/add_post.js' %}"></script>
<script type="module" src="{% static 'js/app/home-sidebar.js' %}"></script>
{% endblock %}
