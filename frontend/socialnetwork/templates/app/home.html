{% extends 'app/base.html' %}
{% load static %}
{% block title %}Trang chủ{% endblock %}
{% block main_content %}
<div class="max-w-[1400px] mx-auto px-2 sm:px-4 py-4 grid grid-cols-1 lg:grid-cols-12 gap-4">
  <!-- Left sidebar -->
  <aside class="hidden lg:block lg:col-span-3 space-y-2 sticky top-16 h-fit">
    <a href="/profile/" id="sidebarProfile"
      class="flex items-center gap-3 p-2 rounded-lg hover:bg-white dark:hover:bg-gray-800 transition hover-lift">
      <div class="avatar-container">
        <img id="sidebarAvatar" src="/static/default-avatar.png" class="w-9 h-9 rounded-full object-cover avatar-online">
      </div>
      <span id="sidebarName" class="font-semibold text-sm">Trang cá nhân</span>
    </a>
    <a href="/friends/"
      class="flex items-center gap-3 p-2 rounded-lg hover:bg-white dark:hover:bg-gray-800 text-sm font-medium hover-lift">
      <svg class="w-6 h-6 text-gray-600 dark:text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/>
      </svg>
      Bạn bè
    </a>
    <a href="/shares/"
      class="flex items-center gap-3 p-2 rounded-lg hover:bg-white dark:hover:bg-gray-800 text-sm font-medium hover-lift">
      <svg class="w-6 h-6 text-gray-600 dark:text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/>
      </svg>
      Bài chia sẻ
    </a>
    <a href="/groups/"
      class="flex items-center gap-3 p-2 rounded-lg hover:bg-white dark:hover:bg-gray-800 text-sm font-medium hover-lift">
      <svg class="w-6 h-6 text-gray-600 dark:text-gray-400" fill="currentColor" viewBox="0 0 20 20">
         <path d="M13 6a3 3 0 11-6 0 3 3 0 016 0zM18 8a2 2 0 11-4 0 2 2 0 014 0zM14 15a4 4 0 00-8 0v3h8v-3zM6 8a2 2 0 11-4 0 2 2 0 014 0zM16 18v-3a5.972 5.972 0 00-.75-2.906A3.005 3.005 0 0119 15v3h-3zM4.75 12.094A5.973 5.973 0 004 15v3H1v-3a3 3 0 013.75-2.906z"></path>
      </svg>
      Nhóm
    </a>
    <a href="/settings/"
      class="flex items-center gap-3 p-2 rounded-lg hover:bg-white dark:hover:bg-gray-800 text-sm font-medium hover-lift">
      <svg class="w-6 h-6 text-gray-600 dark:text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
      </svg>
      Cài đặt
    </a>
  </aside>

  <!-- Center feed -->
  <main class="lg:col-span-6 space-y-4">
    <div
      class="glass-card rounded-xl shadow-sm p-4 flex gap-3 items-center cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-750 card-hover"
      id="openPostComposer">
      <div class="avatar-container">
        <img id="composerAvatar" src="/static/default-avatar.png" class="w-10 h-10 rounded-full object-cover avatar-online">
      </div>
      <div class="flex-1 py-2.5 px-4 rounded-full bg-fb-secondary dark:bg-gray-700 text-gray-500 text-sm">Bạn đang nghĩ
        gì?</div>
    </div>

    <div class="glass-card rounded-xl shadow-sm">
      <nav class="flex border-b dark:border-gray-700 text-sm font-semibold">
        <button type="button" data-home-tab="feed" class="flex-1 py-3 border-b-2 border-fb-primary text-fb-primary">Bài
          viết</button>
        <button type="button" data-home-tab="incoming"
          class="flex-1 py-3 text-gray-500 dark:text-[#b0b3b8] hover:bg-fb-secondary dark:hover:bg-[#3a3b3c]">Lời mời
          nhận</button>
        <button type="button" data-home-tab="outgoing"
          class="flex-1 py-3 text-gray-500 dark:text-[#b0b3b8] hover:bg-fb-secondary dark:hover:bg-[#3a3b3c]">Lời mời đã
          gửi</button>
      </nav>
      <div id="homeTabFeed" class="p-0">
        <div id="post-container" class="divide-y dark:divide-gray-700"></div>
      </div>
      <div id="homeTabIncoming" class="hidden p-4 space-y-2"></div>
      <div id="homeTabOutgoing" class="hidden p-4 space-y-2"></div>
    </div>
  </main>

  <!-- Right sidebar -->
  <aside class="hidden lg:block lg:col-span-3 space-y-4 sticky top-16 h-fit">
    <div class="glass-card rounded-xl shadow-sm p-4 card-hover">
      <h3 class="font-bold text-gray-500 text-sm mb-3">Lời mời kết bạn</h3>
      <div id="homeFriendRequests" class="space-y-2"></div>
    </div>
    <div class="glass-card rounded-xl shadow-sm p-4 card-hover">
      <div class="flex items-center justify-between mb-3">
        <h3 class="font-bold text-gray-500 text-sm">Gợi ý kết bạn</h3>
        <a href="/friend-suggest/" class="text-xs text-fb-primary font-semibold hover:underline">Xem tất cả</a>
      </div>
      <div id="homeFriendSuggest" class="space-y-2"></div>
    </div>
  </aside>
</div>
{% endblock %}
{% block post_scripts %}
<script type="module" src="{% static 'js/app/feed.js' %}"></script>
<script type="module" src="{% static 'js/app/home-tabs.js' %}"></script>
<script type="module" src="{% static 'js/app/add_post.js' %}"></script>
<script type="module" src="{% static 'js/app/home-sidebar.js' %}"></script>
{% endblock %}
