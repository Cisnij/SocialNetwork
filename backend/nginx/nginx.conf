user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ─── Logging — $uri thay $request để ẩn query string (token WS) ──
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time';

    # Log riêng WS — dễ debug disconnect/reconnect
    log_format ws '$remote_addr [$time_local] '
                  '"$request_method $uri $server_protocol" '
                  '$status rt=$request_time';

    access_log /var/log/nginx/access.log main;

    # ─── Performance ─────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    reset_timedout_connection on;
    client_body_timeout 30;
    send_timeout 30;

    # ─── Buffer ──────────────────────────────────────────────
    client_max_body_size 50M;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;
    proxy_buffer_size 16k;
    proxy_buffers 4 32k;
    proxy_busy_buffers_size 64k;

    # ─── Gzip ────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ─── Rate Limiting ───────────────────────────────────────
    # Đếm số REQUEST trong 1 khoảng thời gian
    limit_req_zone $binary_remote_addr zone=api:10m    rate=100r/s;  # API thông thường
    limit_req_zone $binary_remote_addr zone=auth:10m   rate=10r/m;   # Login/register chặt hơn
    limit_req_zone $binary_remote_addr zone=upload:10m rate=5r/s;    # Upload ảnh/video
    limit_req_zone $binary_remote_addr zone=ws_connect:10m rate=30r/m; # WS connect
    # 30r/m: 4 WS routes × reconnect vài lần = ~20 connect/phút → thoải mái
    # burst=20 cho phép connect cùng lúc khi mở app

    # ─── Connection Limiting ─────────────────────────────────
    # Đếm số CONNECTION đang mở cùng lúc
    limit_conn_zone $binary_remote_addr zone=http_conn:10m; # HTTP
    limit_conn_zone $binary_remote_addr zone=ws_conn:10m;   # WS

    # ─── Hide nginx version ──────────────────────────────────
    server_tokens off;

    # ─── Map WS upgrade header ───────────────────────────────
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ─── Upstream ────────────────────────────────────────────
    upstream django {
        server django:8000;
        keepalive 32;
    }

    server {
        listen 80;

        # ─── Security Headers ─────────────────────────────────
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # HTTP: 50 connection/IP cùng lúc
        # MXH user mở nhiều tab, gọi nhiều API cùng lúc
        limit_conn http_conn 50;

        # ─── Static Files ────────────────────────────────────
        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
            tcp_nopush on;
        }

        # ─── Auth — rate limit chặt ──────────────────────────
        location ~* ^/api/(auth|login|register|password) {
            limit_req zone=auth burst=10 nodelay;
            limit_req_status 429;

            proxy_pass http://django;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ─── WebSocket ───────────────────────────────────────
        location /ws/ {
            # Chặn request không phải WS upgrade
            if ($http_upgrade != "websocket") {
                return 426;
            }

            # Rate limit WS connect
            # 30r/m + burst=20: đủ cho 4 WS routes + reconnect bình thường
            # Chặn spam reconnect liên tục
            limit_req zone=ws_connect burst=20 nodelay;
            limit_req_status 429;

            # Connection limit WS: 100/IP
            # 1 user 5 tab × 4 WS = 20 conn
            # 5 user cùng IP (nhà/văn phòng) = 100 conn
            limit_conn ws_conn 100;

            proxy_pass http://django;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 86400;  # 24h — WS tồn tại lâu
            proxy_send_timeout 86400;
            proxy_connect_timeout 60;
            proxy_buffering off;       # realtime, không buffer delay

            access_log /var/log/nginx/ws.log ws;
        }

        # ─── Upload — timeout dài hơn ────────────────────────
        location ~* ^/api/.*(upload|avatar|photo|media) {
            limit_req zone=upload burst=10 nodelay;
            limit_req_status 429;

            proxy_pass http://django;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120;
            proxy_connect_timeout 10;
        }

        # ─── API ─────────────────────────────────────────────
        location /api/ {
            # 100r/s + burst=200: thoải mái cho MXH
            # user scroll feed, like, comment liên tục không bị chặn
            limit_req zone=api burst=200 nodelay;
            limit_req_status 429;

            proxy_pass http://django;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60;
            proxy_connect_timeout 10;
        }

        # ─── App ─────────────────────────────────────────────
        location / {
            limit_req zone=api burst=50 nodelay;

            proxy_pass http://django;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60;
            proxy_connect_timeout 10;
        }

        # ─── Block hidden files ──────────────────────────────
        location ~ /\. {
            deny all;
            access_log off;
        }

        # ─── Custom error pages ──────────────────────────────
        error_page 426 /426.html;
        error_page 429 /429.html;
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}