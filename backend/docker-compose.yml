

networks:
  prod-network:
    driver: bridge

volumes:
  percona_data:
    external: true
  esdata:
    external: true
  redis-data:
  static-files:
  logs-data:
  backups-data:

services:

  percona:
    image: percona/percona-server:8.4
    container_name: percona
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - percona_data:/var/lib/mysql
    networks:
      - prod-network
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - prod-network
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD-SHELL",
             "curl -sf -u elastic:${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:latest
    container_name: redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - prod-network
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
# ─── Nginx ───────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static-files:/app/staticfiles:ro
    ports:
      - "127.0.0.1:80:80"
    networks:
      - prod-network
    depends_on:
      - django

  # ─── Django ──────────────────────────────────────────
  django:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: django
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - static-files:/app/staticfiles
      - logs-data:/app/logs
    networks:
      - prod-network
    depends_on:
      percona:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Celery Worker ───────────────────────────────────
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: celery-worker
    restart: unless-stopped
    command: celery -A backend worker -Q celery --loglevel=info --concurrency=4
    env_file:
      - .env
    volumes:
      - logs-data:/app/logs
      - backups-data:/app/backups
    networks:
      - prod-network
    depends_on:
      - django

  celery-worker-notifications:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: celery-worker-notifications
    restart: unless-stopped
    command: celery -A backend worker -Q notifications --loglevel=info --concurrency=2
    env_file:
      - .env
    volumes:
      - logs-data:/app/logs
      - backups-data:/app/backups
    networks:
      - prod-network
    depends_on:
      - django

  celery-worker-emails:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: celery-worker-emails
    restart: unless-stopped
    command: celery -A backend worker -Q emails --loglevel=info --concurrency=2
    env_file:
      - .env
    volumes:
      - logs-data:/app/logs
      - backups-data:/app/backups
    networks:
      - prod-network
    depends_on:
      - django

  # ─── Celery Beat ─────────────────────────────────────
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: celery-beat
    restart: unless-stopped
    command: celery -A backend beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - .env
    volumes:
      - logs-data:/app/logs
    networks:
      - prod-network
    depends_on:
      - django