components:
  schemas:
    Action:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        actor:
          type: string
          readOnly: true
        verb:
          type: string
          maxLength: 255
        target:
          type: string
          readOnly: true
        action_object:
          type: string
          readOnly: true
        timestamp:
          type: string
          format: date-time
      required:
      - action_object
      - actor
      - id
      - target
      - verb
    AuthProviderEnum:
      enum:
      - local
      - google
      type: string
      description: |-
        * `local` - Local
        * `google` - Google
    Block:
      type: object
      properties:
        blocker:
          allOf:
          - $ref: '#/components/schemas/Profile'
          readOnly: true
        blocked:
          allOf:
          - $ref: '#/components/schemas/Profile'
          readOnly: true
        blocked_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - blocked
      - blocked_at
      - blocker
    Comment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/Profile'
          readOnly: true
        reply_count:
          type: integer
          readOnly: true
        reactions:
          type: string
          readOnly: true
        user_is_reaction:
          type: string
          readOnly: true
        tagged_users_info:
          type: string
          readOnly: true
        tagged_users:
          type: array
          items:
            type: integer
            writeOnly: true
          writeOnly: true
        deleted:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        deleted_by_cascade:
          type: boolean
          readOnly: true
        is_pinned:
          type: boolean
        content:
          type: string
          maxLength: 200
        created_at:
          type: string
          format: date-time
          readOnly: true
        post:
          type: integer
          readOnly: true
        parent:
          type: integer
          nullable: true
      required:
      - content
      - created_at
      - deleted
      - deleted_by_cascade
      - id
      - post
      - reactions
      - reply_count
      - tagged_users_info
      - user
      - user_is_reaction
    Conversation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        is_group:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        members:
          type: array
          items:
            $ref: '#/components/schemas/ConversationMember'
          readOnly: true
        last_message:
          type: string
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        unread_count:
          type: string
          readOnly: true
      required:
      - created_at
      - id
      - last_message
      - members
      - unread_count
      - updated_at
    ConversationMember:
      type: object
      properties:
        user:
          allOf:
          - $ref: '#/components/schemas/Profile'
          readOnly: true
        joined_at:
          type: string
          format: date-time
          readOnly: true
        last_read_message:
          type: integer
          maximum: 18446744073709551615
          minimum: 0
          format: int64
          nullable: true
      required:
      - joined_at
      - user
    CustomRegister:
      type: object
      properties:
        email:
          type: string
          format: email
        password1:
          type: string
          writeOnly: true
        password2:
          type: string
          writeOnly: true
        firstname:
          type: string
        lastname:
          type: string
        phone_number:
          type: string
        birthday:
          type: string
          format: date
      required:
      - birthday
      - email
      - firstname
      - lastname
      - password1
      - password2
      - phone_number
    CustomeLogin:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
      - password
    Email:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          title: Địa chỉ email
          maxLength: 254
        primary:
          type: boolean
        verified:
          type: boolean
      required:
      - email
      - id
    FileTypeEnum:
      enum:
      - image
      - file
      - video
