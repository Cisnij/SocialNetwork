networks:
  dev-network:
    driver: bridge

volumes:
  percona_data_dev:       # DB riêng cho dev, không đụng prod
  redis-data-dev:         # Redis riêng cho dev
  esdata_dev:             # Elasticsearch riêng cho dev
  static-files:           # static files
  logs-data:              # logs
  backups-data:           # backups

services:

  # ─── Percona (MySQL) ─────────────────────────────────
  percona:
    image: percona/percona-server:8.4
    container_name: percona-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: SocialNetwork_dev    # tự tạo DB lúc init lần đầu
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - percona_data_dev:/var/lib/mysql
    networks:
      - dev-network
    ports:
      - "127.0.0.1:3307:3306"   # 3307 tránh conflict với prod (3306)
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Elasticsearch ───────────────────────────────────
  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: elasticsearch-dev
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - ES_JAVA_OPTS=-Xms256m -Xmx512m    # nhẹ hơn prod
    volumes:
      - esdata_dev:/usr/share/elasticsearch/data
    networks:
      - dev-network
    ports:
      - "127.0.0.1:9201:9200"   # 9201 tránh conflict với prod (9200)
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u elastic:${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ─── Redis ───────────────────────────────────────────
  redis:
    image: redis:latest
    container_name: redis-dev
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis-data-dev:/data
    networks:
      - dev-network
    ports:
      - "127.0.0.1:6380:6379"   # 6380 tránh conflict với prod (6379)
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Django (backend) ────────────────────────────────
  django:
    build:
      context: .                # Dockerfile nằm trong thư mục backend/
      dockerfile: Dockerfile
    container_name: django-dev
    restart: unless-stopped
    env_file:
      - .env                    # dùng .env của branch dev (DEBUG=True, DB_NAME=SocialNetwork_dev)
    volumes:
      - .:/app                  # mount code trực tiếp → hot-reload khi sửa file
      - static-files:/app/staticfiles
      - logs-data:/app/logs
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - dev-network
    depends_on:
      percona:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Dockerfile đã có ENTRYPOINT chạy migrate + collectstatic trước
    # CMD override ở đây: dùng --reload để hot-reload khi code thay đổi
    command:
      - granian
      - --interface
      - asginl
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --workers
      - "1"
      - --runtime-threads
      - "2"
      - --reload
      - backend.asgi:application
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─── Celery Worker ───────────────────────────────────
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: celery-worker-dev
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - .:/app
      - logs-data:/app/logs
      - backups-data:/app/backups
    networks:
      - dev-network
    depends_on:
      django:
        condition: service_healthy
    entrypoint: []
    command: celery -A backend worker -Q celery --loglevel=info --concurrency=2

  celery-worker-notifications:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: celery-worker-notifications-dev
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - .:/app
      - logs-data:/app/logs
      - backups-data:/app/backups
    networks:
      - dev-network
    depends_on:
      django:
        condition: service_healthy
    entrypoint: []
    command: celery -A backend worker -Q notifications --loglevel=info --concurrency=1

  celery-worker-emails:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: celery-worker-emails-dev
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - .:/app
      - logs-data:/app/logs
      - backups-data:/app/backups
    networks:
      - dev-network
    depends_on:
      django:
        condition: service_healthy
    entrypoint: []
    command: celery -A backend worker -Q emails --loglevel=info --concurrency=1

  # ─── Celery Beat ─────────────────────────────────────
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: celery-beat-dev
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - .:/app
      - logs-data:/app/logs
    networks:
      - dev-network
    depends_on:
      django:
        condition: service_healthy
    entrypoint: []
    command: celery -A backend beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler